{% extends "base.html" %}
{% block title %}Log in · Minecraft Manager{% endblock %}
{% block content %}
<section class="login-card card">
  <h2>Administrator login</h2>
  <p class="muted">Sign in to manage your servers.</p>
  {% if error %}<p class="message error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('login_post') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" required autofocus autocomplete="username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <button class="button primary full" type="submit">Log in</button>
  </form>
</section>
{% endblock %}
