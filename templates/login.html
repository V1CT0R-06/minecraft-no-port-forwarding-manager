{% extends "base.html" %}
{% block title %}Log in · Minecraft Homelab{% endblock %}
{% block content %}
<section class="login-card card">
  <span class="login-mark" aria-hidden="true">M</span>
  <h1>Welcome home</h1>
  <p class="muted">Sign in to look after your Minecraft servers.</p>
  {% if error %}<p class="message error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('login_post') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" required autofocus autocomplete="username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <button class="button primary full" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
