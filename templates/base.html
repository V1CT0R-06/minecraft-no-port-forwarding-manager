<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}{{ panel_title }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="nav-shell">
      <a class="brand" href="{{ url_for('index') if session.get('logged_in') else url_for('login') }}">{{ panel_title }}</a>
    {% if session.get('logged_in') %}
      <nav class="main-nav" aria-label="Main navigation">
        <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' else '' }}">Dashboard</a>
        <a href="{{ url_for('speed_test_page') }}" class="{{ 'active' if request.endpoint == 'speed_test_page' else '' }}">Speed test</a>
        <a href="{{ url_for('new_server') }}" class="{{ 'active' if request.endpoint == 'new_server' else '' }}">New server</a>
        <a href="{{ url_for('removed_servers') }}" class="{{ 'active' if request.endpoint == 'removed_servers' else '' }}">Removed</a>
        <a href="{{ url_for('tutorial') }}" class="{{ 'active' if request.endpoint == 'tutorial' else '' }}">Help</a>
      </nav>
      <form method="post" action="{{ url_for('logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="button quiet" type="submit">Log out</button>
      </form>
    {% endif %}
    </div>
  </header>
  <main class="page-shell">{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
