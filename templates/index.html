{% extends "base.html" %}
{% block content %}
<div id="message" class="message hidden"></div>

<section class="dashboard-hero">
  <div>
    <h1>Dashboard</h1>
    <p>Host and server status.</p>
  </div>
  <div class="hero-actions">
    <a class="button primary" href="{{ url_for('new_server') }}">+ Create server</a>
    <a class="button secondary" href="{{ url_for('tutorial') }}">Get help</a>
  </div>
</section>

<section class="card host-card">
  <div class="section-heading"><h2>Host</h2><span id="last-updated" class="update-pill">Loading…</span></div>
  <div id="host-grid" class="metric-grid"><p class="muted">Loading host information…</p></div>
</section>

<div class="content-heading"><h2>Servers</h2></div>
<section id="server-grid" class="server-grid">
  <article class="card server-card"><p class="muted">Loading Minecraft servers…</p></article>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='app.js') }}"></script>{% endblock %}
